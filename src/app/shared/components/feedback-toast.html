<div
  class="toast-region"
  [class.editing]="editing()"
  [class.has-action]="feedback.action()"
  role="status"
  aria-live="polite"
>
  @if (feedback.message()) {
    <div class="toast">
      <app-icon name="check" /><span>{{ feedback.message() }}</span>
      @if (feedback.action(); as action) {
        <button
          type="button"
          class="undo-action"
          [disabled]="feedback.busy()"
          (click)="feedback.runAction()"
        >
          {{ feedback.busy() ? (action.pendingLabel ?? 'Working…') : action.label }}
        </button>
      }
      <button
        type="button"
        class="toast-dismiss"
        aria-label="Dismiss notification"
        (click)="feedback.close()"
      >
        <app-icon name="close" />
      </button>
    </div>
  }
</div>
