<button
  #trigger
  type="button"
  class="menu-trigger"
  role="combobox"
  [id]="controlId() || menuId() + '-trigger'"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
  aria-haspopup="listbox"
  [attr.aria-controls]="menuId()"
  [attr.aria-expanded]="open()"
  [attr.aria-activedescendant]="open() ? menuId() + '-option-' + activeIndex() : null"
  [attr.popovertarget]="menuId()"
  [disabled]="isDisabled()"
  (keydown)="onKeydown($event)"
  (blur)="onBlur()"
>
  <span class="menu-label">{{ currentLabel() }}</span
  ><app-icon name="chevron" [class.is-open]="open()" />
</button>
<div
  #panel
  [id]="menuId()"
  class="menu-panel glass-menu"
  popover
  role="listbox"
  [attr.aria-label]="label()"
  [style.left.px]="left()"
  [style.top.px]="top()"
  [style.width.px]="width()"
  (beforetoggle)="beforeToggle($event)"
>
  @for (option of options(); track option.value; let i = $index) {
    <div
      role="option"
      class="menu-option"
      [id]="menuId() + '-option-' + i"
      [attr.data-option]="i"
      [attr.aria-selected]="currentValue() === option.value"
      [class.is-active]="activeIndex() === i"
      [class.is-action]="option.action"
      (pointermove)="activeIndex.set(i)"
      (pointerdown)="$event.preventDefault()"
      (click)="choose(i)"
    >
      <span>{{ option.label }}</span>
      @if (currentValue() === option.value) {
        <app-icon name="check" />
      }
    </div>
  }
</div>
