<section class="collection-section" [attr.aria-labelledby]="railId() + '-heading'">
  <div class="collection-heading">
    <h2 [id]="railId() + '-heading'">{{ title() }}</h2>
    <div class="collection-heading__actions">
      <span class="recipe-count"
        >{{ recipes().length }} {{ recipes().length === 1 ? 'recipe' : 'recipes' }}</span
      >
      <div class="rail-controls">
        <button
          type="button"
          class="rail-arrow"
          [attr.aria-label]="'Previous recipe in ' + title()"
          [attr.aria-controls]="railId()"
          [disabled]="!canScrollPrevious()"
          (click)="scrollByCard(-1)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="m15 6-6 6 6 6" />
          </svg>
        </button>
        <button
          type="button"
          class="rail-arrow"
          [attr.aria-label]="'Next recipe in ' + title()"
          [attr.aria-controls]="railId()"
          [disabled]="!canScrollNext()"
          (click)="scrollByCard(1)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="m9 6 6 6-6 6" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div
    class="rail-window"
    [class.has-previous]="canScrollPrevious()"
    [class.has-next]="canScrollNext()"
  >
    <svg class="filter-defs" aria-hidden="true">
      <defs>
        <filter
          [id]="filterId()"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
          color-interpolation-filters="sRGB"
        >
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.012 0.06"
            numOctaves="1"
            seed="7"
            result="ripple"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="ripple"
            scale="12"
            xChannelSelector="R"
            yChannelSelector="G"
          />
          <feGaussianBlur stdDeviation="0.65" />
        </filter>
      </defs>
    </svg>
    <div
      #recipeRail
      [id]="railId()"
      class="recipe-rail"
      role="region"
      [attr.aria-label]="title() + ', horizontal scrolling'"
      tabindex="0"
      (scroll)="onScroll()"
      (pointerdown)="interruptScroll()"
      (wheel)="interruptScroll()"
      (keydown)="onKeydown($event)"
    >
      @for (recipe of recipes(); track recipe.id) {
        <a class="recipe-card" [routerLink]="['/recipes', recipe.id]">
          <div class="recipe-card__media">
            @if (recipe.imageDataUrl) {
              <img
                class="recipe-image"
                [src]="recipe.imageDataUrl"
                alt=""
                loading="lazy"
                decoding="async"
              />
            } @else {
              <app-food-placeholder [seed]="recipe.id" />
            }
          </div>
          <div class="recipe-card__content">
            <h3>{{ recipe.title }}</h3>
            @if (recipe.servings) {
              <p>{{ recipe.servings }} servings</p>
            }
          </div>
        </a>
      }
    </div>
    <div
      class="edge-glass edge-glass--start"
      aria-hidden="true"
      [style.backdrop-filter]="'url(#' + filterId() + ') blur(2px)'"
    ></div>
    <div
      class="edge-glass edge-glass--end"
      aria-hidden="true"
      [style.backdrop-filter]="'url(#' + filterId() + ') blur(2px)'"
    ></div>
  </div>
</section>
